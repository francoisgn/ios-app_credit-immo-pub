name: pre-commit
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.3.0 && pre-commit run --all-files --show-diff-on-failure
