<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} : page déplacée</title>
  <!-- Les pages de Crédit Immo sont sur francois-g.com depuis la version 1.1.0 (ios-app_credit-immo#305). GitHub Pages
       ne sait pas rediriger côté serveur : redirection immédiate côté navigateur, URL canonique, lien visible. -->
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
  <link rel="canonical" href="{{ page.redirect_to }}">
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Cette page a déménagé : <a href="{{ page.redirect_to }}">{{ page.redirect_to }}</a>.</p>
</body>
</html>
